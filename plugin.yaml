name: kibisis
version: "0.2.0"
description: "Puts external content that reaches the model through a side door (read_file on the web cache, curl/wget/gh output in the terminal, execute_code that hits the network) into the same untrusted-data envelope Hermes core already uses for web/browser/MCP results, and leaves a visible footer when core's own threat-pattern scan fires. Framing only by default: nothing is blocked, no tool loses a byte of output. Opt-in install gate: a lock of publisher+version+hash tuples under pip/uv/npm/npx/cargo; unblessed installs park for a human."
author: "CocaKova"
homepage: https://github.com/CocaKova/hermes-kibisis
license: MIT
provides_hooks:
  - transform_tool_result
  - pre_tool_call
  - post_approval_response
